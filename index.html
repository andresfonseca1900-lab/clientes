<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Suministros Automatizados — Clientes</title>
<style>
  :root{
    --bg:#0a0a0b;
    --panel:#151517;
    --panel2:#1c1c1f;
    --line:#2b2b2f;
    --red:#c81e1e;
    --red-dark:#8f1414;
    --red-glow:#e23a3a;
    --chrome:#c7ccd4;
    --chrome-dim:#8b8f96;
    --white:#f4f4f5;
    --good:#3fa36b;
    --bad:#e0453a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', -apple-system, sans-serif;
    background:var(--bg);
    color:var(--white);
    -webkit-tap-highlight-color:transparent;
  }
  header{
    background:linear-gradient(180deg,#000 0%,#0d0d0f 100%);
    border-bottom:1px solid var(--line);
    color:var(--white);
    padding:16px 16px 14px;
    display:flex;
    align-items:center;
    gap:14px;
    position:sticky;
    top:0;
    z-index:20;
    box-shadow:0 2px 16px rgba(0,0,0,.6);
  }
  #logoBox{
    width:52px;height:52px;
    border-radius:10px;
    background:#000;
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    overflow:hidden;
    cursor:pointer;
  }
  #logoBox img{width:100%;height:100%;object-fit:cover;}
  header h1{
    font-family:Arial, sans-serif;
    font-size:17px;
    font-weight:800;
    letter-spacing:.4px;
    margin:0;
    background:linear-gradient(180deg, var(--red-glow), var(--red-dark));
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    text-transform:uppercase;
  }
  header p{
    margin:2px 0 0;
    font-size:11px;
    color:var(--chrome-dim);
    letter-spacing:1px;
    text-transform:uppercase;
  }
  #logoInput{display:none;}

  .toolbar{
    padding:14px 16px 10px;
    display:flex;
    gap:8px;
    background:var(--bg);
    position:sticky;
    top:82px;
    z-index:15;
  }
  #search{
    flex:1;
    padding:11px 13px;
    border:1.5px solid var(--line);
    border-radius:9px;
    font-size:15px;
    background:var(--panel);
    color:var(--white);
  }
  #search::placeholder{color:var(--chrome-dim);}
  #search:focus{outline:none;border-color:var(--red);}
  #addBtn{
    background:linear-gradient(180deg, var(--red-glow), var(--red-dark));
    color:white;
    border:none;
    border-radius:9px;
    width:46px;
    font-size:22px;
    font-weight:300;
    cursor:pointer;
    flex-shrink:0;
    box-shadow:0 2px 8px rgba(200,30,30,.35);
  }
  #addBtn:active{filter:brightness(.85);}

  #count{
    padding:0 16px 10px;
    font-size:12px;
    color:var(--chrome-dim);
    letter-spacing:.3px;
  }

  #list{padding:0 16px 100px;}

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 15px;
    margin-bottom:10px;
    cursor:pointer;
    transition:border-color .15s, box-shadow .15s;
    border-left:3px solid var(--red-dark);
  }
  .card:active{border-color:var(--red); box-shadow:0 2px 12px rgba(200,30,30,.15);}
  .card-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
    margin-bottom:6px;
  }
  .card-company{
    font-weight:700;
    font-size:16px;
    color:var(--white);
    line-height:1.25;
  }
  .card-contact{
    font-size:13px;
    color:var(--chrome-dim);
    margin-top:1px;
  }
  .card-row{
    font-size:13.5px;
    color:var(--chrome);
    display:flex;
    align-items:center;
    gap:6px;
    margin-top:4px;
  }
  .card-row .ico{width:14px;text-align:center;opacity:.7;font-size:12px;}
  .card-row a{color:var(--chrome);text-decoration:none;}

  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--chrome-dim);
  }
  .empty .big{font-size:38px;margin-bottom:8px;}
  .empty p{font-size:14px;margin:4px 0;}

  /* Modal */
  #overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,.65);
    display:none;
    align-items:flex-end;
    z-index:50;
  }
  #overlay.show{display:flex;}
  #sheet{
    background:var(--panel2);
    border-top:1px solid var(--line);
    width:100%;
    max-height:92vh;
    border-radius:16px 16px 0 0;
    padding:20px 18px calc(20px + env(safe-area-inset-bottom));
    overflow-y:auto;
    animation:up .22s ease-out;
  }
  @keyframes up{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  #sheet h2{
    font-family:Arial, sans-serif;
    font-size:18px;
    margin:0 0 16px;
    color:var(--white);
    text-transform:uppercase;
    letter-spacing:.5px;
  }
  .field{margin-bottom:13px;}
  .field label{
    display:block;
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:.5px;
    color:var(--chrome-dim);
    margin-bottom:5px;
    font-weight:600;
  }
  .field input{
    width:100%;
    padding:11px 12px;
    border:1.5px solid var(--line);
    border-radius:8px;
    font-size:15px;
    background:var(--panel);
    color:var(--white);
  }
  .field input::placeholder{color:#5a5a60;}
  .field input:focus{outline:none;border-color:var(--red);}

  .sheet-actions{
    display:flex;
    gap:10px;
    margin-top:18px;
  }
  .btn{
    flex:1;
    padding:13px;
    border-radius:9px;
    border:none;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
  }
  .btn-save{background:linear-gradient(180deg, var(--red-glow), var(--red-dark));color:white;}
  .btn-save:active{filter:brightness(.85);}
  .btn-cancel{background:var(--panel);color:var(--chrome);border:1.5px solid var(--line);}
  .btn-delete{
    width:100%;
    background:none;
    border:none;
    color:var(--bad);
    padding:12px;
    font-size:14px;
    margin-top:6px;
    cursor:pointer;
  }

  #fabExport{
    position:fixed;
    bottom:18px;right:18px;
    background:var(--panel2);
    color:var(--chrome);
    border:1px solid var(--line);
    border-radius:24px;
    padding:12px 18px;
    font-size:13px;
    font-weight:600;
    box-shadow:0 4px 14px rgba(0,0,0,.5);
    cursor:pointer;
    z-index:10;
  }
  #toast{
    position:fixed;
    bottom:70px;left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--panel2);
    border:1px solid var(--line);
    color:white;
    padding:10px 18px;
    border-radius:8px;
    font-size:13px;
    opacity:0;
    transition:all .25s;
    pointer-events:none;
    z-index:60;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>

    <h1 id="companyTitle">Suministros Automatizados</h1>
    <p>Directorio de clientes</p>
  </div>
</header>

<div class="toolbar">
  <input id="search" type="text" placeholder="Buscar por empresa, contacto...">
  <button id="addBtn" onclick="openForm()">+</button>
</div>
<div id="count"></div>

<div id="list"></div>

<button id="fabExport" onclick="exportCSV()">⬇ Exportar CSV</button>

<div id="overlay" onclick="if(event.target===this) closeForm()">
  <div id="sheet">
    <h2 id="formTitle">Nuevo cliente</h2>
    <input type="hidden" id="editId">
    <div class="field">
      <label>Nombre de la empresa *</label>
      <input id="f_empresa" type="text" placeholder="Ej. Ferretería López">
    </div>
    <div class="field">
      <label>Persona de contacto</label>
      <input id="f_contacto" type="text" placeholder="Ej. Juan López">
    </div>
    <div class="field">
      <label>Teléfono</label>
      <input id="f_telefono" type="tel" placeholder="Ej. 55 1234 5678">
    </div>
    <div class="field">
      <label>Correo</label>
      <input id="f_correo" type="email" placeholder="Ej. contacto@empresa.com">
    </div>
    <div class="field">
      <label>Dirección</label>
      <input id="f_direccion" type="text" placeholder="Ej. Av. Reforma 123, CDMX">
    </div>
    <div class="sheet-actions">
      <button class="btn btn-cancel" onclick="closeForm()">Cancelar</button>
      <button class="btn btn-save" onclick="saveClient()">Guardar</button>
    </div>
    <button class="btn-delete" id="deleteBtn" style="display:none" onclick="deleteClient()">Eliminar cliente</button>
  </div>
</div>

<div id="toast"></div>

<script>
let clients = [];
let editingId = null;

async function loadAll(){
  try{
    const res = await window.storage.get('clients-data', false);
    clients = res && res.value ? JSON.parse(res.value) : [];
  }catch(e){
    clients = [];
  }
  try{
    const logoRes = await window.storage.get('company-logo', false);
    if(logoRes && logoRes.value){
      document.getElementById('logoImg').src = logoRes.value;
    }
  }catch(e){
    // sin logo personalizado guardado: se usa el logo por defecto incrustado
  }
  try{
    const nameRes = await window.storage.get('company-name', false);
    if(nameRes && nameRes.value){
      document.getElementById('companyTitle').textContent = nameRes.value;
    }
  }catch(e){}
  render();
}

async function persist(){
  try{
    await window.storage.set('clients-data', JSON.stringify(clients), false);
  }catch(e){
    showToast('Error al guardar');
  }
}

function render(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  const list = document.getElementById('list');
  const filtered = clients.filter(c=>{
    if(!q) return true;
    return (c.empresa||'').toLowerCase().includes(q) ||
           (c.contacto||'').toLowerCase().includes(q) ||
           (c.correo||'').toLowerCase().includes(q) ||
           (c.telefono||'').toLowerCase().includes(q);
  }).sort((a,b)=> (a.empresa||'').localeCompare(b.empresa||''));

  document.getElementById('count').textContent =
    clients.length === 0 ? '' : filtered.length + ' de ' + clients.length + ' clientes';

  if(filtered.length === 0){
    list.innerHTML = clients.length === 0
      ? '<div class="empty"><div class="big">📋</div><p><strong>Aún no tienes clientes</strong></p><p>Toca + para agregar el primero</p></div>'
      : '<div class="empty"><div class="big">🔍</div><p>Sin resultados para "'+escapeHtml(q)+'"</p></div>';
    return;
  }

  list.innerHTML = filtered.map(c => `
    <div class="card" onclick="openForm('${c.id}')">
      <div class="card-top">
        <div>
          <div class="card-company">${escapeHtml(c.empresa)}</div>
          ${c.contacto ? '<div class="card-contact">'+escapeHtml(c.contacto)+'</div>' : ''}
        </div>
      </div>
      ${c.telefono ? '<div class="card-row"><span class="ico">☎</span><a href="tel:'+encodeURIComponent(c.telefono)+'" onclick="event.stopPropagation()">'+escapeHtml(c.telefono)+'</a></div>' : ''}
      ${c.correo ? '<div class="card-row"><span class="ico">✉</span><a href="mailto:'+encodeURIComponent(c.correo)+'" onclick="event.stopPropagation()">'+escapeHtml(c.correo)+'</a></div>' : ''}
      ${c.direccion ? '<div class="card-row"><span class="ico">📍</span>'+escapeHtml(c.direccion)+'</div>' : ''}
    </div>
  `).join('');
}

function escapeHtml(s){
  if(!s) return '';
  return s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function openForm(id){
  editingId = id || null;
  document.getElementById('overlay').classList.add('show');
  if(id){
    const c = clients.find(x=>x.id===id);
    document.getElementById('formTitle').textContent = 'Editar cliente';
    document.getElementById('f_empresa').value = c.empresa || '';
    document.getElementById('f_contacto').value = c.contacto || '';
    document.getElementById('f_telefono').value = c.telefono || '';
    document.getElementById('f_correo').value = c.correo || '';
    document.getElementById('f_direccion').value = c.direccion || '';
    document.getElementById('deleteBtn').style.display = 'block';
  }else{
    document.getElementById('formTitle').textContent = 'Nuevo cliente';
    ['f_empresa','f_contacto','f_telefono','f_correo','f_direccion'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('deleteBtn').style.display = 'none';
  }
}

function closeForm(){
  document.getElementById('overlay').classList.remove('show');
  editingId = null;
}

async function saveClient(){
  const empresa = document.getElementById('f_empresa').value.trim();
  if(!empresa){
    showToast('El nombre de la empresa es obligatorio');
    return;
  }
  const data = {
    empresa,
    contacto: document.getElementById('f_contacto').value.trim(),
    telefono: document.getElementById('f_telefono').value.trim(),
    correo: document.getElementById('f_correo').value.trim(),
    direccion: document.getElementById('f_direccion').value.trim(),
  };
  if(editingId){
    const idx = clients.findIndex(c=>c.id===editingId);
    clients[idx] = {...clients[idx], ...data};
  }else{
    clients.push({id: 'c_'+Date.now(), ...data});
  }
  await persist();
  closeForm();
  render();
  showToast('Cliente guardado');
}

async function deleteClient(){
  if(!editingId) return;
  clients = clients.filter(c=>c.id!==editingId);
  await persist();
  closeForm();
  render();
  showToast('Cliente eliminado');
}

function exportCSV(){
  if(clients.length === 0){
    showToast('No hay clientes para exportar');
    return;
  }
  const headers = ['Empresa','Contacto','Telefono','Correo','Direccion'];
  const rows = clients.map(c => [c.empresa,c.contacto,c.telefono,c.correo,c.direccion]
    .map(v => '"'+(v||'').replace(/"/g,'""')+'"').join(','));
  const csv = headers.join(',') + '\n' + rows.join('\n');
  const blob = new Blob(["\uFEFF"+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'clientes.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

document.getElementById('search').addEventListener('input', render);

document.getElementById('logoInput').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async function(ev){
    const dataUrl = ev.target.result;
    document.getElementById('logoImg').src = dataUrl;
    try{
      await window.storage.set('company-logo', dataUrl, false);
    }catch(err){
      showToast('No se pudo guardar el logo');
    }
  };
  reader.readAsDataURL(file);
});

loadAll();
</script>
